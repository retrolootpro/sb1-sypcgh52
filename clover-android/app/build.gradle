plugins {
    id 'com.android.application'
}

android {
    namespace 'com.retrolootpro.clover'
    compileSdk 35

    defaultConfig {
        applicationId 'com.retrolootpro.clover'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
}

dependencies {
    implementation 'com.clover.sdk:clover-android-sdk:262.2'
    implementation 'com.clover.sdk:clover-android-connector-sdk:262.2'
}
